---
# Raspberry Pi OS Bookworm usa KMS. Para los hosts donde se active
# force_kiosk_hdmi, mantenemos HDMI presente desde el kernel (cmdline.txt)
# aunque la TV entre en standby o deje de anunciar hotplug.
#
# Si force_kiosk_hdmi no está activo, estas tareas NO cambian la configuración
# de pantalla de la Raspberry. Así las instalaciones existentes quedan iguales.

- name: Validar conector HDMI configurado
  assert:
    that:
      - kiosk_hdmi_connector in ['HDMI-A-1', 'HDMI-A-2']
    fail_msg: "kiosk_hdmi_connector debe ser HDMI-A-1 o HDMI-A-2."
  when: force_kiosk_hdmi | bool

- name: Calcular mascara vc4.force_hotplug
  set_fact:
    kiosk_hdmi_force_hotplug_mask: "{{ 1 if kiosk_hdmi_connector == 'HDMI-A-1' else 2 }}"
  when: force_kiosk_hdmi | bool

- name: Detectar config.txt
  stat:
    path: /boot/firmware/config.txt
  register: fw
  when: force_kiosk_hdmi | bool

- name: Set rpi_config_path
  set_fact:
    rpi_config_path: "{{ '/boot/firmware/config.txt' if fw.stat.exists else '/boot/config.txt' }}"
  when: force_kiosk_hdmi | bool

- name: Guardar backup original de config.txt una sola vez
  copy:
    src: "{{ rpi_config_path }}"
    dest: "{{ rpi_config_path }}.pre-kiosk-hdmi"
    remote_src: yes
    force: no
    owner: root
    group: root
    mode: preserve
  become: yes
  when: force_kiosk_hdmi | bool

- name: Quitar bloque HDMI legacy administrado por Ansible
  blockinfile:
    path: "{{ rpi_config_path }}"
    marker: "# {mark} Ansible kiosk HDMI"
    state: absent
  become: yes
  when: force_kiosk_hdmi | bool

# Bookworm normalmente usa /boot/firmware/cmdline.txt. Se conserva fallback
# por seguridad, aunque este deploy está pensado para Bookworm.
- name: Detectar cmdline.txt de Bookworm
  stat:
    path: /boot/firmware/cmdline.txt
  register: fw_cmdline
  when: force_kiosk_hdmi | bool

- name: Set rpi_cmdline_path
  set_fact:
    rpi_cmdline_path: "{{ '/boot/firmware/cmdline.txt' if fw_cmdline.stat.exists else '/boot/cmdline.txt' }}"
  when: force_kiosk_hdmi | bool

- name: Verificar que cmdline.txt existe
  stat:
    path: "{{ rpi_cmdline_path }}"
  register: rpi_cmdline_stat
  when: force_kiosk_hdmi | bool

- name: Fallar si no existe cmdline.txt
  fail:
    msg: "No existe {{ rpi_cmdline_path }}; no se modificó la configuración HDMI."
  when:
    - force_kiosk_hdmi | bool
    - not rpi_cmdline_stat.stat.exists

- name: Guardar backup original de cmdline.txt una sola vez
  copy:
    src: "{{ rpi_cmdline_path }}"
    dest: "{{ rpi_cmdline_path }}.pre-kiosk-hdmi"
    remote_src: yes
    force: no
    owner: root
    group: root
    mode: preserve
  become: yes
  when: force_kiosk_hdmi | bool

# Si ya se había probado otra configuración del mismo conector, la retiramos
# antes de añadir la configuración canónica para evitar parámetros duplicados.
- name: Quitar video= previo del conector administrado
  replace:
    path: "{{ rpi_cmdline_path }}"
    regexp: '(^|\s+)video={{ kiosk_hdmi_connector | regex_escape }}:\S+'
    replace: '\1'
  become: yes
  when: force_kiosk_hdmi | bool

- name: Quitar vc4.force_hotplug previo
  replace:
    path: "{{ rpi_cmdline_path }}"
    regexp: '(^|\s+)vc4\.force_hotplug=\S+'
    replace: '\1'
  become: yes
  when: force_kiosk_hdmi | bool

- name: Normalizar espacios de cmdline.txt
  replace:
    path: "{{ rpi_cmdline_path }}"
    regexp: ' {2,}'
    replace: ' '
  become: yes
  when: force_kiosk_hdmi | bool

- name: Forzar HDMI persistente 1080p60 en Bookworm KMS
  lineinfile:
    path: "{{ rpi_cmdline_path }}"
    regexp: '^(.*\S)\s*$'
    line: '\1 video={{ kiosk_hdmi_connector }}:{{ kiosk_hdmi_mode }} vc4.force_hotplug={{ kiosk_hdmi_force_hotplug_mask }}'
    backrefs: yes
  become: yes
  when: force_kiosk_hdmi | bool

- name: Leer cmdline.txt final para validar HDMI
  slurp:
    src: "{{ rpi_cmdline_path }}"
  register: rpi_cmdline_final
  become: yes
  when: force_kiosk_hdmi | bool

- name: Validar parámetros HDMI de Bookworm
  assert:
    that:
      - "('video=' ~ kiosk_hdmi_connector ~ ':' ~ kiosk_hdmi_mode) in (rpi_cmdline_final.content | b64decode)"
      - "('vc4.force_hotplug=' ~ (kiosk_hdmi_force_hotplug_mask | string)) in (rpi_cmdline_final.content | b64decode)"
    fail_msg: "Los parámetros HDMI no quedaron correctamente en {{ rpi_cmdline_path }}."
    success_msg: "HDMI persistente configurado en {{ rpi_cmdline_path }}; se aplicará tras reiniciar."
  when: force_kiosk_hdmi | bool

- name: Instalar script de mantenimiento
  copy:
    src: rpi_maintenance.sh
    dest: /usr/local/bin/rpi_maintenance.sh
    mode: "0755"
  become: yes

- name: Instalar rpi-maintenance.service
  template:
    src: rpi-maintenance.service.j2
    dest: /etc/systemd/system/rpi-maintenance.service
    mode: "0644"
  notify: [reload systemd]
  become: yes

- name: Instalar rpi-maintenance.timer
  template:
    src: rpi-maintenance.timer.j2
    dest: /etc/systemd/system/rpi-maintenance.timer
    mode: "0644"
  notify: [reload systemd]
  become: yes

- name: Habilitar timer mantenimiento
  systemd:
    name: rpi-maintenance.timer
    enabled: yes
    state: started
  become: yes

- name: Instalar wake_hdmi.sh
  copy:
    src: wake_hdmi.sh
    dest: /usr/local/bin/wake_hdmi.sh
    mode: "0755"
  become: yes

- name: Instalar wake-hdmi.service
  template:
    src: wake-hdmi.service.j2
    dest: /etc/systemd/system/wake-hdmi.service
    mode: "0644"
  notify: reload systemd
  become: yes

- name: Instalar wake-hdmi.timer
  template:
    src: wake-hdmi.timer.j2
    dest: /etc/systemd/system/wake-hdmi.timer
    mode: "0644"
  notify: reload systemd
  become: yes

- name: Habilitar wake-hdmi.service
  systemd:
    name: wake-hdmi.service
    enabled: yes
  become: yes

- name: Arrancar+Habilitar wake-hdmi.timer
  systemd:
    name: wake-hdmi.timer
    state: started
    enabled: yes
  become: yes
