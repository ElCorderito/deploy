electron_branch: master
signage_branch:  master

# --- Rutas base y repos
electron_root: /opt/electron_rasp
signage_root:  /opt/signage

# Usa estos remotos (puedes dejarlos igual que en tu Pi)
electron_repo: "git@github.com:ElCorderito/electron_rasp.git"
signage_repo: "git@github-signage:ElCorderito/signage.git"

# Usuario que corre los servicios de tu app (normalmente el ansible_user)
kiosk_user: "{{ ansible_user }}"

# --- Python / Electron
python_bin:  /usr/bin/python3
venv_dir: /opt/electron_rasp/electron_rasp/.venv
flask_app_dir: "{{ electron_root }}/electron_rasp/flask_app"
requirements_file: "{{ electron_root }}/electron_rasp/requirements.txt"
electron_app_dir:  "{{ electron_root }}/electron_rasp/electron"

# --- Timers
electron_update_every: "2min"
signage_update_every:  "10min"
maintenance_hour:      "03:00:00"

# --- Mantenimiento APT
apt_every_days: 30

# --- HDMI persistente para Raspberry Pi OS Bookworm + KMS + X11
# Se deja apagado por defecto para no cambiar Raspberry existentes.
# Activalo por host con force_kiosk_hdmi=true en inventory.ini o host_vars.
force_kiosk_hdmi: false
kiosk_hdmi_connector: "HDMI-A-1"
kiosk_hdmi_mode: "1920x1080@60D"

# --- Audio HDMI del kiosk
# Electron usa el mismo conector definido arriba. El wrapper detecta el UID
# real, activa el perfil HDMI en PipeWire y fuerza ese sink para Electron.
kiosk_audio_enabled: true
kiosk_audio_volume: "100"

# --- Optimización CPU del service de Electron (se aplica si hay >=4 vCPUs)
cpuset_default: "2 3"

anydesk_password: "Emoliano13"

# --- Paquetes base para kiosk/X y utilidades
apt_base_packages:
  - git
  - python3
  - python3-venv
  - python3-pip
  - nodejs
  - npm
  - pulseaudio-utils
  - lxde
  - lightdm
  - xserver-xorg

# --- Autologin de LightDM (para que no pida contraseña)
manage_lightdm: true
lightdm_autologin_user: "{{ kiosk_user }}"
lightdm_session: "LXDE-pi-x"

# --- Remotos (sólo habilitar si ya están instalados por paquete)
enable_remote_services: true
remote_services:
  - anydesk.service
  - teamviewerd.service
